services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: botchan
      POSTGRES_USER: botchan
      POSTGRES_PASSWORD: botchan
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botchan"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - botchan-postgres:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    entrypoint: ["alembic", "upgrade", "head"]
    environment: &api-environment
      DATABASE_URL: postgresql+asyncpg://botchan:botchan@postgres/botchan
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-http://localhost:8000/auth/discord/callback}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      SESSION_SECRET: ${SESSION_SECRET}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      SECURE_COOKIES: "false"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment: *api-environment
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  botchan-postgres:
