# Templates for the two Secrets the base expects. Do not commit real values:
# generate them with kustomize secretGenerator, SOPS, External Secrets or
# whatever your cluster already uses.

apiVersion: v1
kind: Secret
metadata:
  name: botchan-discord
type: Opaque
stringData:
  # From the Discord Developer Portal, under OAuth2 and Bot.
  DISCORD_CLIENT_ID: "123456789012345678"
  DISCORD_CLIENT_SECRET: "replace-me"
  DISCORD_TOKEN: "replace-me"
  # openssl rand -base64 32
  SESSION_SECRET: "replace-me"
  # python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())'
  TOKEN_ENCRYPTION_KEY: "replace-me"
---
# Only needed WITHOUT CloudNativePG. A CNPG Cluster named botchan-db creates a
# secret of this name and shape by itself, so skip this one if you use CNPG.
apiVersion: v1
kind: Secret
metadata:
  name: botchan-db-app
type: kubernetes.io/basic-auth
stringData:
  username: "botchan"
  password: "replace-me"
  host: "postgres.database.svc.cluster.local"
  port: "5432"
  dbname: "botchan"
