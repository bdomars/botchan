apiVersion: apps/v1
kind: Deployment
metadata:
  name: botchan-admin
  labels:
    app.kubernetes.io/name: botchan
    app.kubernetes.io/component: admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: botchan
      app.kubernetes.io/component: admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: botchan
        app.kubernetes.io/component: admin
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: admin
          image: ghcr.io/bdomars/botchan-api
          # Same image as the API, different app. It runs no migrations of its
          # own: the API Deployment's init container owns the schema.
          command: ["uvicorn", "botchan_api.admin.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            # The same secret and settings as the API, plus the ADMIN_* keys
            # this component adds to the ConfigMap.
            - secretRef:
                name: botchan-discord
            - configMapRef:
                name: botchan-config
          env:
            # Built from the parts of a CNPG-style secret. To use a different
            # secret, change the five names below (see README.md).
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: botchan-db-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: botchan-db-app
                  key: password
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: botchan-db-app
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: botchan-db-app
                  key: port
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: botchan-db-app
                  key: dbname
            - name: DATABASE_URL
              value: postgresql+asyncpg://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)
          # /readyz runs SELECT 1, so the pod leaves the Service while the
          # database is unreachable. /healthz never touches it, so a database
          # outage does not restart the pods.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
