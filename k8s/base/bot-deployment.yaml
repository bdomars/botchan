apiVersion: apps/v1
kind: Deployment
metadata:
  name: botchan-bot
  labels:
    app.kubernetes.io/name: botchan
    app.kubernetes.io/component: bot
spec:
  # Keep this at 1. Two bots on the same Discord token would each manage the
  # same voice channels, and would fight over creating and deleting them.
  replicas: 1
  # Recreate, so the old bot is gone before the new one connects.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: botchan
      app.kubernetes.io/component: bot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: botchan
        app.kubernetes.io/component: bot
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # The bot handles SIGTERM: it closes the config listener and the Discord
      # connection, which takes about a second.
      terminationGracePeriodSeconds: 30
      containers:
        - name: bot
          image: ghcr.io/bdomars/botchan
          env:
            # Built from the parts of a CNPG-style secret. To use a different
            # secret, change the five names below (see README.md). Keep these
            # five first: the API keeps the same order, so one patch fits both.
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: botchan-db-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: botchan-db-app
                  key: password
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: botchan-db-app
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: botchan-db-app
                  key: port
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: botchan-db-app
                  key: dbname
            - name: DATABASE_URL
              value: postgresql+asyncpg://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)
            - name: DISCORD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: botchan-discord
                  key: DISCORD_TOKEN
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: botchan-config
                  key: LOG_LEVEL
          # The bot serves no HTTP, so there is nothing to probe. It exits on
          # an unrecoverable error and the kubelet restarts it.
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              # No CPU limit on purpose: throttling a gateway client causes
              # heartbeat timeouts and reconnects.
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
